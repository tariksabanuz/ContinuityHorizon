[mod]
id = "connected_textures"
version = "0.1.5"
priority = 100

[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

# Which blocks connect, how a face is joined to its neighbours, and the settings. In the render
# library, beside the section mesher.
[[module]]
id = "ctm"
file = "crates/horizon-client-render/src/lib.rs"
name = "native_connected_textures"
source = "ctm.rs"
visibility = "pub"

# DirectX 12 (FXC): Horizon's terrain shader made ready for FXC; the game crashed at its start there.
[[module]]
id = "fxc_runtime"
file = "crates/horizon-client-render/src/lib.rs"
name = "native_connected_textures_fxc"
source = "fxc_runtime.rs"
visibility = "pub"

[[injection]]
id = "fxc"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::gfx::reuse::On<'_>::create_shader_module"
helper = "fxc.rs"
bindings = [
  { name = "this", ty = "&On<'_>", value = "self" },
  { name = "descriptor", ty = "&wgpu::ShaderModuleDescriptor<'_>", value = "&descriptor" },
]

# Each section Horizon meshes: its glass, panes, bookshelves and sandstone are joined up.
[[injection]]
id = "mesh"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::mesher::Mesher<'_>::mesh_reusing"
helper = "mesh.rs"
bindings = [
  { name = "mesher", ty = "&mut Mesher<'_>", value = "&mut *self" },
  { name = "region", ty = "&[[Option<&Chunk>; 3]; 3]", value = "region" },
  { name = "sy", ty = "i32", value = "sy" },
  { name = "out", ty = "&mut SectionMesh", value = "&mut out" },
  { name = "scratch", ty = "&mut MeshScratch", value = "&mut *scratch" },
]

# Options > Mods: the row and its settings page.
[[injection]]
id = "listed"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "listed.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "settings_click.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Once a frame: the settings, the mod's switch, and meshing the world again after a change.
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]
